[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-da-musica-agent"
version = "1.0.0"
description = "Support agent for Empório da Música: tool calling over SQLite and BM25 across the store policy manual"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
emporio = "emporio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
